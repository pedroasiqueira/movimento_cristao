    <!--
      Pré-visualização ao compartilhar o link no WhatsApp.
      LIMITAÇÃO CONHECIDA: como isto é uma SPA, todas as páginas servem este
      mesmo HTML. O rastreador do WhatsApp não executa JavaScript, então o link
      de uma Mensagem específica mostra estes dados genéricos, e não o título
      dela. Cumprir FR-3 e FR-14 exige pré-renderização por endereço — ver
      PRD §7. Pendência registrada antes do lançamento.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Arca da Sagrada Aliança – Movimento Cristão" />
    <meta
      property="og:description"
      content="A mensagem de hoje, o acervo completo, as músicas e os encontros."
    />
    <meta property="og:locale" content="pt_BR" />
  </head>
